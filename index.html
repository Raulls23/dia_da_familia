<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dia da Família - Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <nav class="bg-blue-600 p-4 text-white shadow-lg mb-8">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold cursor-pointer" onclick="exibirHome()">🏫 Evento Família</h1>
            <div class="space-x-4">
                <button onclick="exibirCriarFormulario()" class="hover:underline">Novo Formulário</button>
                <button onclick="exibirListagem()" class="hover:underline">Responder Quiz</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 max-w-4xl">
        
        <section id="sessao-home" class="text-center py-20">
            <h2 class="text-4xl font-extrabold text-gray-800 mb-4">Bem-vindos ao Dia da Família!</h2>
            <p class="text-gray-600 text-xl">Selecione um quiz criado pelos alunos e teste seus conhecimentos.</p>
        </section>

        <section id="sessao-criar-formulario" class="hidden bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-bold mb-4">Criar Novo Formulário</h2>
            <div class="flex gap-2">
                <input type="text" id="input-nome-formulario" placeholder="Ex: Quiz do Pedro" class="flex-1 border p-2 rounded">
                <button onclick="salvarFormulario()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Criar</button>
            </div>
        </section>

        <section id="sessao-criar-questoes" class="hidden bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-bold mb-4">Adicionar Questão para: <span id="span-nome-form"></span></h2>
            <div class="space-y-3">
                <input type="text" id="q-pergunta" placeholder="Pergunta (Ex: Qual o tamanho do meu pé?)" class="w-full border p-2 rounded">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="q-a" placeholder="Opção A" class="border p-2 rounded">
                    <input type="text" id="q-b" placeholder="Opção B" class="border p-2 rounded">
                    <input type="text" id="q-c" placeholder="Opção C" class="border p-2 rounded">
                    <input type="text" id="q-d" placeholder="Opção D" class="border p-2 rounded">
                </div>
                <select id="q-correta" class="w-full border p-2 rounded">
                    <option value="">Selecione a resposta correta</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
                <button onclick="salvarQuestao()" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">Salvar Questão</button>
                <button onclick="exibirListagem()" class="w-full bg-gray-200 py-2 rounded">Finalizar</button>
            </div>
        </section>

        <section id="sessao-listagem" class="hidden space-y-4">
            <h2 class="text-2xl font-bold text-gray-800">Formulários Disponíveis</h2>
            <div id="lista-formularios" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>

        <section id="sessao-responder" class="hidden bg-white p-6 rounded-lg shadow-md">
            <h2 id="titulo-quiz" class="text-2xl font-bold mb-6 text-blue-600"></h2>
            <div class="mb-6">
                <label class="block text-gray-700 mb-2">Seu Nome:</label>
                <input type="text" id="input-nome-pai" class="w-full border p-2 rounded" placeholder="Digite seu nome completo">
            </div>
            <div id="container-questoes" class="space-y-8"></div>
            <button onclick="enviarRespostas()" class="mt-8 w-full bg-green-500 text-white py-3 rounded-xl font-bold hover:bg-green-600">Enviar Respostas</button>
        </section>

        <section id="sessao-ranking" class="hidden bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-6 text-center">🏆 Ranking de Acertos</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="p-3 border">Nome</th>
                            <th class="p-3 border text-center">Acertos</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-ranking"></tbody>
                </table>
            </div>
            <button onclick="exibirListagem()" class="mt-6 w-full bg-blue-500 text-white py-2 rounded">Voltar para Lista</button>
        </section>

    </main>

    <script>
        const API_URL = 'http://localhost:3000';
        let formularioAtualId = null;

        function alternarSessao(idSessao) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(idSessao).classList.remove('hidden');
        }

        function exibirHome() { alternarSessao('sessao-home'); }
        function exibirCriarFormulario() { alternarSessao('sessao-criar-formulario'); }

        async function exibirListagem() {
            alternarSessao('sessao-listagem');
            const response = await fetch(`${API_URL}/formularios`);
            const formularios = await response.json();
            const container = document.getElementById('lista-formularios');
            container.innerHTML = '';

            formularios.forEach(f => {
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500">
                        <h3 class="font-bold text-lg">${f.nome}</h3>
                        <div class="mt-4 flex gap-2">
                            <button onclick="prepararResponder(${f.id}, '${f.nome}')" class="text-sm bg-blue-100 text-blue-600 px-3 py-1 rounded">Responder</button>
                            <button onclick="prepararQuestao(${f.id}, '${f.nome}')" class="text-sm bg-gray-100 text-gray-600 px-3 py-1 rounded">Add Questão</button>
                            <button onclick="verRanking(${f.id})" class="text-sm bg-yellow-100 text-yellow-700 px-3 py-1 rounded">Ranking</button>
                        </div>
                    </div>
                `;
            });
        }

        async function salvarFormulario() {
            const nome = document.getElementById('input-nome-formulario').value;
            const res = await fetch(`${API_URL}/formularios`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome })
            });
            const novoForm = await res.json();
            prepararQuestao(novoForm.id, novoForm.nome);
        }

        function prepararQuestao(id, nome) {
            formularioAtualId = id;
            document.getElementById('span-nome-form').innerText = nome;
            alternarSessao('sessao-criar-questoes');
        }

        async function salvarQuestao() {
            const dados = {
                formulario_id: formularioAtualId,
                pergunta: document.getElementById('q-pergunta').value,
                opcao_a: document.getElementById('q-a').value,
                opcao_b: document.getElementById('q-b').value,
                opcao_c: document.getElementById('q-c').value,
                opcao_d: document.getElementById('q-d').value,
                resposta_correta: document.getElementById('q-correta').value
            };
            await fetch(`${API_URL}/questoes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            alert('Questão adicionada!');
            document.querySelectorAll('#sessao-criar-questoes input').forEach(i => i.value = '');
        }

        async function prepararResponder(id, nome) {
            formularioAtualId = id;
            document.getElementById('titulo-quiz').innerText = nome;
            const res = await fetch(`${API_URL}/formularios/${id}/questoes`);
            const questoes = await res.json();
            const container = document.getElementById('container-questoes');
            container.innerHTML = '';

            questoes.forEach((q, index) => {
                container.innerHTML += `
                    <div class="questao-item border-b pb-4" data-id="${q.id}">
                        <p class="font-semibold mb-3">${index + 1}. ${q.pergunta}</p>
                        <div class="grid grid-cols-1 gap-2">
                            <label class="flex items-center gap-2 p-2 bg-gray-50 rounded cursor-pointer">
                                <input type="radio" name="q-${q.id}" value="A"> A) ${q.opcao_a}
                            </label>
                            <label class="flex items-center gap-2 p-2 bg-gray-50 rounded cursor-pointer">
                                <input type="radio" name="q-${q.id}" value="B"> B) ${q.opcao_b}
                            </label>
                            <label class="flex items-center gap-2 p-2 bg-gray-50 rounded cursor-pointer">
                                <input type="radio" name="q-${q.id}" value="C"> C) ${q.opcao_c}
                            </label>
                            <label class="flex items-center gap-2 p-2 bg-gray-50 rounded cursor-pointer">
                                <input type="radio" name="q-${q.id}" value="D"> D) ${q.opcao_d}
                            </label>
                        </div>
                    </div>
                `;
            });
            alternarSessao('sessao-responder');
        }

        async function enviarRespostas() {
            const nomeRespondente = document.getElementById('input-nome-pai').value;
            const itens = document.querySelectorAll('.questao-item');
            const respostas = [];

            itens.forEach(item => {
                const questaoId = item.getAttribute('data-id');
                const selecionada = item.querySelector(`input[name="q-${questaoId}"]:checked`);
                if (selecionada) {
                    respostas.push({ questao_id: parseInt(questaoId), opcao_escolhida: selecionada.value });
                }
            });

            await fetch(`${API_URL}/tentativas`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ formulario_id: formularioAtualId, nome_respondente: nomeRespondente, respostas })
            });

            alert('Respostas enviadas com sucesso!');
            verRanking(formularioAtualId);
        }

        async function verRanking(id) {
            const res = await fetch(`${API_URL}/ranking/${id}`);
            const ranking = await res.json();
            const corpo = document.getElementById('corpo-ranking');
            corpo.innerHTML = '';
            
            ranking.forEach(r => {
                corpo.innerHTML += `
                    <tr>
                        <td class="p-3 border">${r.nome_respondente}</td>
                        <td class="p-3 border text-center font-bold text-green-600">${r.acertos}</td>
                    </tr>
                `;
            });
            alternarSessao('sessao-ranking');
        }
    </script>
</body>
</html>
